<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <!-- Garante que o site funcione bem em celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boletim Digital</title>
  <!-- Liga o arquivo de estilos -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="cabecalho">
    <h1>Boletim Digital</h1>
    <p class="subtitulo">8º Ano — Estudante Exemplo</p>
  </header>

  <main class="conteudo">

    <!-- ÁREA DOS CARDS DE RESUMO -->
    <section class="cards" id="cardsResumo">
      <!-- Os cards serão preenchidos pelo JavaScript -->
    </section>

    <!-- ÁREA DA TABELA -->
    <section class="tabela-area">
      <h2>Notas por disciplina</h2>

      <!-- Tabela responsiva: em telas pequenas ela rola na horizontal -->
      <div class="tabela-wrapper">
        <table class="boletim">
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody id="corpoTabela">
            <!-- As linhas serão criadas pelo JavaScript -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- Liga o arquivo JavaScript no final, para o HTML já estar carregado -->
  <script src="script.js"></script>
</body>
</html>
